<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>ניהול — AddMedia</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<style>
  .wrap { max-width: 1100px; padding-top: 24px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0 18px; }
  .stat { background: var(--surface); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--t1); }
  .stat span { font-size: 13px; color: var(--t3); }
  .stat.hot b { color: var(--danger); }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--sunken); border-radius: 12px; overflow-x: auto; }
  .tabs button { border: 0; background: none; font: inherit; font-size: 14px; color: var(--t2); padding: 8px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--surface); color: var(--t1); font-weight: 600; box-shadow: var(--shadow); }
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .item { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .item.p2 { box-shadow: 0 0 0 2px var(--danger); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input, .row select { width: auto; flex: 1; min-width: 140px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--sunken); color: var(--t2); }
  .tag.red { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .body { margin: 8px 0; padding: 10px 12px; border-radius: 10px; background: var(--panel); white-space: pre-wrap; unicode-bidi: plaintext; text-align: start; color: var(--t1); }
  .small { font-size: 13px; color: var(--t3); }
  .btn { height: 38px; padding: 0 14px; font-size: 14px; }
  .btn-danger { background: var(--danger); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--t3); font-weight: 600; font-size: 12px; }
  .media { max-width: 220px; border-radius: 10px; margin-top: 6px; }
  #login { max-width: 420px; margin: 60px auto; }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="logo" href="/"><img src="/favicon.svg" alt="">AddMedia · ניהול</a><nav class="nav"><a href="#" id="logout">יציאה</a></nav></div></header>
<main class="wrap">
  <form id="login" class="card" hidden>
    <h2 style="margin-top:0">כניסה לניהול</h2>
    <label for="tok">טוקן ניהול (ADMIN_TOKEN)</label>
    <input id="tok" type="password" dir="ltr" required autocomplete="current-password">
    <div style="margin-top:14px"><button class="btn btn-primary">כניסה</button></div>
    <div id="lerr" class="err"></div>
  </form>
  <div id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (t) => (t ? new Date(t).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" }) : "");
const REASON = { spam: "ספאם", harassment: "הטרדה", hate: "שנאה", violence: "אלימות", sexual: "מיני", intimate: "אינטימי ללא הסכמה", minor: "קטינים", privacy: "פרטיות", copyright: "זכויות יוצרים", other: "אחר" };
const ACTION = { hide: "הוסר", restore: "שוחזר", dismiss: "נדחה", ban: "השעיה", unban: "ביטול השעיה", block_text: "טקסט נחסם", block_image: "תמונה נחסמה", auto_hide: "הוסתר אוטומטית", takedown: "הוסר לבקשת בעל זכויות", course_meta: "פרטי קורס עודכנו", remove_doc: "מסמך הוסר", remove_event: "אירוע הוסר", create_doc: "מסמך נכתב", edit_doc: "מסמך נערך", student_profile: "פרופיל סטודנט", hold: "הוקפא לאחר בקשת הסרה", restore: "הושב", grant_campus: "מנוי קמפוס הוענק" };
const KIND = { summary: "סיכום", exercise: "תרגול", article: "מאמר" };
const ROLE = { lecturer: "מרצה", institution: "מוסד", author: "מחבר/ת", other: "אחר" };
let token = sessionStorage.getItem("am_admin") || "";
async function api(path, opts = {}) {
  const r = await fetch("/v1/admin/" + path, { method: opts.method || "GET", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { sessionStorage.removeItem("am_admin"); showLogin("הטוקן שגוי."); throw new Error("401"); }
  if (!r.ok) throw new Error(j.error?.message || "שגיאה");
  return j;
}
function showLogin(err = "") { $("#login").hidden = false; $("#app").hidden = true; $("#lerr").textContent = err; }
$("#login").addEventListener("submit", async (e) => { e.preventDefault(); token = $("#tok").value.trim(); sessionStorage.setItem("am_admin", token); start(); });
$("#logout").addEventListener("click", (e) => { e.preventDefault(); sessionStorage.removeItem("am_admin"); token = ""; showLogin(); });

const TABS = [["reports", "דיווחים"], ["resolved", "דיווחים שטופלו"], ["contacts", "פניות"], ["log", "יומן החלטות"], ["users", "משתמשים"], ["ads", "פרסומות"], ["domains", "אתרים"], ["terms", "מילים חסומות"], ["settings", "הגדרות ופרסומת"], ["docs", "מאמרים וסיכומים"], ["takedowns", "הודעות הסרה"]];
let cur = "reports";
async function start() {
  try { const s = await api("stats"); renderStats(s); } catch { return; }
  $("#login").hidden = true; $("#app").hidden = false;
  $("#tabs").innerHTML = TABS.map(([id, l]) => `<button data-t="${id}" class="${id === cur ? "on" : ""}">${l}</button>`).join("");
  $("#tabs").onclick = (e) => { const t = e.target.dataset.t; if (t) { cur = t; start(); } };
  render();
}
function renderStats(s) {
  $("#stats").innerHTML = `<div class="stat ${s.urgentReports ? "hot" : ""}"><b>${s.urgentReports}</b><span>דיווחים דחופים (48 שעות)</span></div><div class="stat"><b>${s.openReports}</b><span>דיווחים פתוחים</span></div><div class="stat"><b>${s.users}</b><span>משתמשים</span></div><div class="stat"><b>${s.activeAds}</b><span>מודעות פעילות</span></div>`;
}
async function render() {
  const v = $("#view");
  v.innerHTML = '<p class="small">טוען…</p>';
  try { v.innerHTML = await VIEWS[cur](); BIND[cur]?.(v); } catch (e) { if (e.message !== "401") v.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
const VIEWS = {
  async reports(status = "open") {
    const { reports } = await api("reports?status=" + status);
    if (!reports.length) return '<p class="small" style="margin-top:16px">אין דיווחים פתוחים. 🎉</p>';
    return '<div class="list">' + reports.map((r) => {
      const it = r.item || {};
      const body = it.body ?? "";
      const media = it.media_key ? `<img class="media" src="/m/${esc(it.media_key)}" alt="">` : "";
      const reasons = [...new Set(String(r.reasons).split(","))].map((x) => `<span class="tag ${["intimate", "minor"].includes(x) ? "red" : ""}">${REASON[x] || x}</span>`).join(" ");
      return `<div class="item ${r.priority >= 2 ? "p2" : ""}" data-id="${esc(String(r.ids).split(",")[0])}" data-uid="${esc(it.user_id || it.uid || "")}">
        <div class="row">${reasons}<span class="tag">${r.n} דיווחים</span><span class="tag">${r.item_type === "chat" ? "צ׳אט" : it.kind === "image" ? "תמונה" : "תגובה"}</span><span class="small">מאז ${when(r.first_at)}</span>${it.status ? `<span class="tag">${esc(it.status)}</span>` : ""}</div>
        <div class="small" style="margin-top:6px">${esc(it.user_name || it.name || "")} · <span dir="ltr">${esc(it.meta?.url || "")}</span></div>
        ${body ? `<div class="body">${esc(body)}</div>` : ""}${media}
        ${r.details ? `<div class="small">פרטי המדווח: ${esc(r.details)}</div>` : ""}
        ${status === "open" ? `<div class="row" style="margin-top:10px"><input class="why" placeholder="נימוק להחלטה (נשמר ביומן)"><button class="btn btn-danger" data-a="hide">הסרה</button><button class="btn btn-secondary" data-a="restore">השארה/שחזור</button><button class="btn btn-secondary" data-a="dismiss">דחיית הדיווח</button><button class="btn btn-secondary" data-a="ban">השעיית המפרסם</button></div>` : ""}
        ${it.user_id || it.uid ? "" : '<div class="small">התוכן כבר לא קיים בחדר.</div>'}
      </div>`;
    }).join("") + "</div>";
  },
  async resolved() { return VIEWS.reports("resolved"); },
  async contacts() {
    const { contacts } = await api("contacts");
    if (!contacts.length) return '<p class="small" style="margin-top:16px">אין פניות.</p>';
    return '<div class="list">' + contacts.map((c) => `<div class="item" data-id="${esc(c.id)}"><div class="row"><span class="tag ${c.kind === "takedown" ? "red" : ""}">${{ takedown: "הסרה", privacy: "פרטיות", publisher: "בעל אתר", accessibility: "נגישות", other: "אחר" }[c.kind] || c.kind}</span><span class="tag">${c.status === "open" ? "פתוחה" : "טופלה"}</span><span class="small">${when(c.created_at)}</span></div><div class="small" style="margin-top:6px">${esc(c.name || "")} · <a href="mailto:${esc(c.email)}" dir="ltr">${esc(c.email)}</a> ${c.url ? `· <a href="${esc(c.url)}" target="_blank" rel="noopener" dir="ltr">${esc(c.url)}</a>` : ""}</div><div class="body">${esc(c.message)}</div>${c.status === "open" ? '<button class="btn btn-secondary" data-a="done">סימון כטופלה</button>' : ""}</div>`).join("") + "</div>";
  },
  async log() {
    const { log } = await api("log");
    return `<table style="margin-top:16px"><tr><th>מתי</th><th>מי</th><th>פעולה</th><th>יעד</th><th>נימוק</th></tr>${log.map((l) => `<tr><td>${when(l.at)}</td><td>${l.actor === "auto" ? "אוטומטי" : "מנהל"}</td><td>${ACTION[l.action] || esc(l.action)}</td><td class="small" dir="ltr">${esc(l.target_type)} ${esc(l.target_id)}</td><td>${esc(l.reason || "")}</td></tr>`).join("")}</table>`;
  },
  async users() {
    const q = $("#uq")?.value || "";
    const { users } = await api("users?q=" + encodeURIComponent(q));
    return `<div class="row" style="margin-top:16px"><input id="uq" placeholder="חיפוש לפי שם או מזהה" value="${esc(q)}"><button class="btn btn-secondary" id="us">חיפוש</button></div><table style="margin-top:12px"><tr><th>שם</th><th>סטודנט</th><th>מזהה</th><th>הצטרף</th><th>העלאות</th><th>פסילות</th><th>קמפוס עד</th><th></th></tr>${users.map((u) => `<tr data-id="${esc(u.id)}"><td>${esc(u.display_name)}</td><td class="small">${u.full_name ? `${esc(u.full_name)}<br>${esc(u.inst)} · ${esc(u.faculty)} · שנה ${u.year} · ${esc(u.track)}${u.email ? `<br><span dir="ltr">${esc(u.email)}</span>` : ""}` : ""}</td><td class="small" dir="ltr">${esc(u.id)}</td><td>${when(u.created_at)}</td><td>${u.credits_media}</td><td>${u.strikes || 0}</td><td>${esc(u.campus_until || "")}</td><td>${u.banned ? '<button class="btn btn-secondary" data-a="unban">ביטול השעיה</button>' : '<button class="btn btn-danger" data-a="ban">השעיה</button> <button class="btn btn-secondary" data-a="credit">+5 העלאות</button> <button class="btn btn-secondary" data-a="campus">קמפוס לסמסטר</button>'}</td></tr>`).join("")}</table>`;
  },
  async ads() {
    const { ads } = await api("ads");
    return `<form id="adf" class="item" style="margin-top:16px"><div class="row"><input name="advertiser" placeholder="שם המפרסם" required><input name="title" placeholder="כותרת (עד 140 תווים)" required maxlength="140"></div><div class="row" style="margin-top:8px"><input name="body" placeholder="טקסט משני (לא חובה)"><input name="url" placeholder="https://… קישור" dir="ltr" required><input name="image_url" placeholder="קישור לתמונה (לא חובה)" dir="ltr"></div><div class="row" style="margin-top:8px"><input name="target_domain" placeholder="דומיין יעד (ריק = בכל מקום)" dir="ltr"><select name="placement"><option value="top">ראש הפאנל</option><option value="feed">בתוך התגובות</option></select><button class="btn btn-primary">הוספת מודעה</button></div><p class="small">לפני פרסום: ודאו שהמודעה לא משתמשת במותג של האתר המוצג, ושהמפרסם אושר ידנית.</p></form>
      <table style="margin-top:12px"><tr><th>מפרסם</th><th>כותרת</th><th>יעד</th><th>מיקום</th><th>חשיפות</th><th>קליקים</th><th></th></tr>${ads.map((a) => `<tr data-id="${esc(a.id)}"><td>${esc(a.advertiser)}</td><td>${esc(a.title)}</td><td dir="ltr">${esc(a.target_domain || "הכל")}</td><td>${a.placement === "top" ? "ראש" : "תגובות"}</td><td>${a.impressions}</td><td>${a.clicks}</td><td><button class="btn btn-secondary" data-a="del">מחיקה</button></td></tr>`).join("")}</table>`;
  },
  async domains() {
    const { domains } = await api("domains");
    return `<form id="df" class="item" style="margin-top:16px"><div class="row"><input name="domain" placeholder="example.co.il" dir="ltr" required><label><input type="checkbox" name="no_comments" style="width:auto"> בלי תגובות</label><label><input type="checkbox" name="no_ads" style="width:auto"> בלי מודעות</label><label><input type="checkbox" name="disabled" style="width:auto"> כיבוי מלא</label><input name="note" placeholder="הערה"><button class="btn btn-primary">שמירה</button></div></form>
      <table style="margin-top:12px"><tr><th>דומיין</th><th>תגובות</th><th>מודעות</th><th>כבוי</th><th>הערה</th><th></th></tr>${domains.map((d) => `<tr data-id="${esc(d.domain)}"><td dir="ltr">${esc(d.domain)}</td><td>${d.no_comments ? "✗" : "✓"}</td><td>${d.no_ads ? "✗" : "✓"}</td><td>${d.disabled ? "כבוי" : ""}</td><td>${esc(d.note || "")}</td><td><button class="btn btn-secondary" data-a="del">הסרה</button></td></tr>`).join("")}</table>`;
  },
  async terms() {
    const { terms } = await api("terms");
    return `<form id="tf" class="item" style="margin-top:16px"><label>הוספת מילים או ביטויים לחסימה (שורה לכל ביטוי)</label><textarea name="terms" style="min-height:90px"></textarea><div style="margin-top:8px"><button class="btn btn-primary">הוספה</button></div><p class="small">בנוסף לרשימה המובנית. ההתאמה מתעלמת מניקוד, מאותיות סופיות ומנקודות בין אותיות, ותופסת גם תחיליות (ו, ה, ש, ב, ל, כ, מ).</p></form>
      <div class="row" style="margin-top:12px">${terms.map((t) => `<span class="tag" data-id="${esc(t.term)}">${esc(t.term)} <a href="#" data-a="del">✕</a></span>`).join(" ") || '<span class="small">אין מילים נוספות.</span>'}</div>`;
  },
  async settings() {
    const { settings: s } = await api("settings");
    const ad = s.centerAd;
    const ck = (b) => (b ? "checked" : "");
    return `<form id="setf" class="item" style="margin-top:16px;display:grid;gap:14px">
      <h3 style="margin:0">הפאנל ודף המדיה</h3>
      <div class="row" style="gap:18px;flex-wrap:wrap">
        <label>סף לדף בודד (קוראים)<br><input name="pageThreshold" type="number" min="1" max="500" value="${s.pageThreshold}" style="width:110px"><div class="small">מתחת לזה הפאנל נפתח על כל האתר</div></label>
        <label>תמונות בחינם למשתמש<br><input name="freeMedia" type="number" min="0" max="100" value="${s.freeMedia}" style="width:110px"></label>
        <label>ימי שמירה לתוכן<br><input name="retentionDays" type="number" min="1" max="365" value="${s.retentionDays}" style="width:110px"></label>
        <label style="align-self:end"><input name="linkMedia" type="checkbox" ${ck(s.linkMedia)}> תמונות יכולות להיות קישור חי</label>
      </div>
      <h3 style="margin:8px 0 0">הקמפוס</h3>
      <div class="row" style="gap:18px;flex-wrap:wrap">
        <label>מסמכים לסטודנט בחודש<br><input name="campusDocsPerMonth" type="number" min="1" max="10000" value="${s.campusDocsPerMonth}" style="width:110px"></label>
        <label>תווים למסמך<br><input name="campusCharsPerDoc" type="number" min="100" max="1000000" value="${s.campusCharsPerDoc}" style="width:130px"></label>
        <label>תווים סה״כ לסטודנט<br><input name="campusCharsTotal" type="number" min="100" max="100000000" value="${s.campusCharsTotal}" style="width:150px"></label>
        <label>מחיר לסמסטר (אגורות)<br><input name="campusPrice" type="number" min="0" max="1000000" value="${s.campusPrice}" style="width:110px"><div class="small">${(s.campusPrice / 100).toFixed(2)} ₪</div></label>
      </div>
      <h3 style="margin:8px 0 0">חלון הפרסום במרכז</h3>
      <div class="small">מוצג בדף המדיה, במרכז המסך. רק מכאן אפשר לשנות אותו.</div>
      <label><input name="ad_on" type="checkbox" ${ck(ad.on)}> מופעל</label>
      <div class="row" style="gap:12px;flex-wrap:wrap">
        <label>תווית<br><input name="ad_label" value="${esc(ad.label)}" style="width:140px"></label>
        <label style="flex:1;min-width:260px">כותרת<br><input name="ad_title" value="${esc(ad.title)}" maxlength="120" style="width:100%"></label>
      </div>
      <label>טקסט<br><input name="ad_body" value="${esc(ad.body)}" maxlength="300" style="width:100%"></label>
      <div class="row" style="gap:12px;flex-wrap:wrap">
        <label style="flex:1;min-width:260px">קישור (https://…)<br><input name="ad_url" dir="ltr" value="${esc(ad.url || "")}" style="width:100%"></label>
        <label style="flex:1;min-width:260px">תמונה (https://…)<br><input name="ad_image" dir="ltr" value="${esc(ad.image || "")}" style="width:100%"></label>
      </div>
      <div class="row" style="gap:16px"><label><input name="mode_center" type="checkbox" ${ck(ad.modes.includes("center"))}> במרכז הבקרה</label><label><input name="mode_campus" type="checkbox" ${ck(ad.modes.includes("campus"))}> בגרסת הסטודנטים</label></div>
      <div><button class="btn btn-primary">שמירה</button> <span id="setmsg" class="small"></span></div>
    </form>`;
  },
  async docs() {
    const { docs } = await api("docs");
    if (!docs.length) return '<p class="small" style="margin-top:16px">עוד לא הועלו מסמכים.</p>';
    const who = (d) => d.full_name ? `${esc(d.full_name)}<div class="small">${esc(d.s_inst)} · ${esc(d.s_faculty)} · שנה ${d.s_year} · ${esc(d.track)}${d.email ? ` · <span dir="ltr">${esc(d.email)}</span>` : ""}</div>` : `${esc(d.user_name)}<div class="small">בלי פרופיל סטודנט</div>`;
    return `<table style="margin-top:16px"><tr><th>מתי</th><th>מי</th><th>פסילות</th><th>מקום</th><th>סוג</th><th>כותרת</th><th>תווים</th><th>מצב</th><th></th></tr>${docs.map((d) => `<tr data-id="${esc(d.id)}"><td>${when(d.created_at)}${d.updated_at && d.updated_at !== d.created_at ? `<div class="small">נערך ${when(d.updated_at)}</div>` : ""}</td><td>${who(d)}</td><td>${d.strikes ? `<span class="tag ${d.strikes >= 3 ? "red" : ""}">${d.strikes}</span>` : "0"}</td><td>${esc(d.inst)} · ${esc(d.faculty)} · ${d.year}${d.course ? " · " + esc(d.course) : ""}</td><td>${KIND[d.kind] || esc(d.kind)}${d.lecturer_name ? `<div class="small">${esc(d.lecturer_name)}${d.lesson_date ? " · " + esc(d.lesson_date) : ""}${d.lesson_no ? " · שיעור " + d.lesson_no : ""}</div>` : ""}</td><td><a href="/media/campus/doc/${esc(d.id)}" target="_blank" rel="noopener">${esc(d.title)}</a>${d.link_url ? ` <a class="small" href="${esc(d.link_url)}" target="_blank" rel="noopener" dir="ltr">מקור</a>` : ""}</td><td>${d.chars ?? 0}</td><td>${d.status === "visible" ? "" : `<span class="tag red">${d.status === "hold" ? "מוקפא" : esc(d.status)}</span>`}</td><td>${d.status === "removed" ? "" : `<button class="btn btn-danger btn-sm" data-del="${esc(d.id)}">הסרה</button>`}</td></tr>`).join("")}</table>`;
  },
  async takedowns() {
    const { takedowns } = await api("campus/takedowns");
    if (!takedowns.length) return '<p class="small" style="margin-top:16px">אין הודעות הסרה.</p>';
    const STATUS = { open: "פתוחה · הפריטים מוקפאים", handled: "הוסר סופית", reverted: "הושב (הבקשה נדחתה)" };
    return '<div class="list">' + takedowns.map((t) => {
      const m = t.meta || {};
      const place = [m.inst, m.faculty, m.year ? "שנה " + m.year : "", m.course].filter(Boolean).map(esc).join(" · ");
      const docs = (t.docs || []).map((d) => `<label class="row" style="gap:6px"><input type="checkbox" class="td-doc" value="${esc(d.id)}" style="width:auto" ${d.status === "removed" ? "disabled" : "checked"}> ${KIND[d.kind] || esc(d.kind)} · <a href="/media/campus/doc/${esc(d.id)}" target="_blank" rel="noopener">${esc(d.title)}</a> · ${esc(d.name)}${d.status && d.status !== "visible" ? ` <span class="tag ${d.status === "removed" ? "red" : ""}">${d.status === "hold" ? "מוקפא" : esc(d.status)}</span>` : ""}${(m.items || []).find((i) => i.id === d.id)?.sections ? ` <span class="small">סעיפים ${(m.items.find((i) => i.id === d.id).sections).join(", ")}</span>` : ""}</label>`).join("");
      const others = (m.items || []).filter((i) => i.type !== "doc").map((i) => `<div class="small">${i.type === "chat" ? "צ׳אט" : "תגובה/תמונה"} <span dir="ltr">${esc(i.id)}</span> בחדר <span dir="ltr">${esc(i.roomId || "")}</span>${i.held ? ' <span class="tag">מוקפא</span>' : ""}</div>`).join("");
      return `<div class="item" data-id="${esc(t.id)}"><div class="row"><span class="tag red">${ROLE[m.role] || esc(m.role || "")}</span><span class="tag">${STATUS[t.status] || esc(t.status)}</span><span class="small">${when(t.created_at)}</span></div>
        <div class="small" style="margin-top:6px">${esc(t.name || "")} · <a href="mailto:${esc(t.email)}" dir="ltr">${esc(t.email)}</a>${t.phone ? ` · <span dir="ltr">${esc(t.phone)}</span>` : ""}${place ? " · " + place : ""}${m.viewer ? ` · משתמש <span dir="ltr">${esc(m.viewer)}</span>` : ""}</div>
        <div class="body">${esc(t.message)}</div>
        ${docs ? `<div style="display:grid;gap:4px">${docs}</div>` : ""}${others}${!docs && !others ? '<div class="small">לא צוינו פריטים.</div>' : ""}
        ${t.status === "open" ? `<div class="row" style="margin-top:10px"><button class="btn btn-danger" data-a="apply">הסרה סופית של המסומנים</button>${place ? '<button class="btn btn-danger" data-a="all">הסרת כל המסמכים במקום</button>' : ""}<button class="btn btn-secondary" data-a="restore">השבה (דחיית הבקשה)</button></div>` : ""}
      </div>`;
    }).join("") + "</div>";
  },
};
const BIND = {
  settings(v) {
    $("#setf").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const body = {
        pageThreshold: Number(f.get("pageThreshold")), freeMedia: Number(f.get("freeMedia")), retentionDays: Number(f.get("retentionDays")), linkMedia: !!f.get("linkMedia"),
        campusDocsPerMonth: Number(f.get("campusDocsPerMonth")), campusCharsPerDoc: Number(f.get("campusCharsPerDoc")), campusCharsTotal: Number(f.get("campusCharsTotal")), campusPrice: Number(f.get("campusPrice")),
        centerAd: { on: !!f.get("ad_on"), label: f.get("ad_label"), title: f.get("ad_title"), body: f.get("ad_body"), url: f.get("ad_url") || null, image: f.get("ad_image") || null,
          modes: [f.get("mode_center") ? "center" : null, f.get("mode_campus") ? "campus" : null].filter(Boolean) },
      };
      await api("settings", { method: "POST", body });
      $("#setmsg").textContent = "נשמר. השינוי מגיע לכולם תוך דקה.";
    };
  },
  docs(v) {
    v.onclick = async (e) => { const id = e.target.dataset.del; if (id && confirm("להסיר את המסמך?")) { await api("docs/" + id, { method: "DELETE" }); render(); } };
  },
  reports(v) {
    v.onclick = async (e) => {
      const a = e.target.dataset.a; if (!a) return;
      const it = e.target.closest(".item"); const note = it.querySelector(".why")?.value || "";
      if (a === "ban") { if (!confirm("להשעות את המפרסם ולמחוק את כל התוכן שלו?")) return; await api("users/" + it.dataset.uid, { method: "POST", body: { ban: true, purge: true, note } }); await api("reports/" + it.dataset.id, { method: "POST", body: { action: "hide", note } }); }
      else await api("reports/" + it.dataset.id, { method: "POST", body: { action: a, note } });
      start();
    };
  },
  takedowns(v) {
    v.onclick = async (e) => {
      const a = e.target.dataset.a; if (!a) return;
      const it = e.target.closest(".item"); const id = it.dataset.id;
      if (a === "restore") { if (!confirm("להשיב את הפריטים המוקפאים ולדחות את הבקשה? (שלוש דחיות חוסמות את הפונה)")) return; await api(`campus/takedown/${id}/restore`, { method: "POST" }); }
      if (a === "apply") { const docIds = [...it.querySelectorAll(".td-doc:checked")].map((x) => x.value); if (!confirm(docIds.length ? `להסיר סופית ${docIds.length} מסמכים ולרשום פסילה לכותבים?` : "להסיר סופית את כל הפריטים שהבקשה הקפיאה ולרשום פסילה?")) return; await api(`campus/takedown/${id}/apply`, { method: "POST", body: docIds.length ? { docIds } : {} }); }
      if (a === "all") { if (!confirm("להסיר את כל המסמכים הגלויים במקום הזה?")) return; await api(`campus/takedown/${id}/apply`, { method: "POST", body: { all: true } }); }
      start();
    };
  },
  contacts(v) { v.onclick = async (e) => { if (e.target.dataset.a === "done") { await api("contacts/" + e.target.closest(".item").dataset.id, { method: "POST" }); start(); } }; },
  users(v) {
    $("#us").onclick = () => render();
    v.onclick = async (e) => {
      const a = e.target.dataset.a; if (!a) return; const id = e.target.closest("tr").dataset.id;
      if (a === "ban") { const purge = confirm("למחוק גם את כל התוכן שפרסם?"); await api("users/" + id, { method: "POST", body: { ban: true, purge, note: prompt("נימוק:") || "" } }); }
      if (a === "unban") await api("users/" + id, { method: "POST", body: { ban: false } });
      if (a === "credit") await api("credits", { method: "POST", body: { userId: id, media: 5 } });
      if (a === "campus") await api("campus/grant", { method: "POST", body: { userId: id, days: 182 } });
      render();
    };
  },
  ads(v) {
    $("#adf").onsubmit = async (e) => { e.preventDefault(); await api("ads", { method: "POST", body: Object.fromEntries(new FormData(e.target)) }); start(); };
    v.onclick = async (e) => { if (e.target.dataset.a === "del" && confirm("למחוק את המודעה?")) { await api("ads/" + e.target.closest("tr").dataset.id, { method: "DELETE" }); start(); } };
  },
  domains(v) {
    $("#df").onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target); await api("domains", { method: "POST", body: { domain: f.get("domain"), note: f.get("note"), no_comments: !!f.get("no_comments"), no_ads: !!f.get("no_ads"), disabled: !!f.get("disabled") } }); render(); };
    v.onclick = async (e) => { if (e.target.dataset.a === "del") { await api("domains/" + encodeURIComponent(e.target.closest("tr").dataset.id), { method: "DELETE" }); render(); } };
  },
  terms(v) {
    $("#tf").onsubmit = async (e) => { e.preventDefault(); await api("terms", { method: "POST", body: { terms: new FormData(e.target).get("terms") } }); render(); };
    v.onclick = async (e) => { if (e.target.dataset.a === "del") { e.preventDefault(); await api("terms/" + encodeURIComponent(e.target.closest(".tag").dataset.id), { method: "DELETE" }); render(); } };
  },
};
token ? start() : showLogin();
</script>
