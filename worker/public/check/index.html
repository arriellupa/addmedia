<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>בדיקת דפדפן · AddMedia</title>
<style>
  :root { --ink: #14161a; --muted: #5b5f69; --line: #e7e5ea; --ok: #0f7b4b; --bad: #b4232c; --wait: #8a6d00; --accent: #a3195b; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #f6f5f8; color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
  h1 { font-size: 19px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .mark { flex: 0 0 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--wait); }
  .ok .mark { background: var(--ok); } .bad .mark { background: var(--bad); }
  .lbl { flex: 0 0 104px; font-weight: 600; }
  .val { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .val bdi, .val code { direction: ltr; unicode-bidi: isolate; }
  code { font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .frame { margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .frame-h { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
  iframe { display: block; width: 100%; height: 360px; border: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<h1>בדיקת דפדפן</h1>
<p class="sub">צלמו את המסך הזה ושלחו אותו — הוא מראה אם AddMedia יכולה לרוץ בדפדפן שלכם.</p>
<div class="card" id="rows">
  <div class="row bad" id="r-js"><span class="mark">✕</span><span class="lbl">JavaScript</span><span class="val">כבוי בדפדפן</span></div>
</div>
<div class="frame"><div class="frame-h">הפאנל עצמו, כאן בתוך הדף:</div><iframe id="f" title="AddMedia" src="about:blank"></iframe></div>
<p class="sub" style="margin-top:12px"><a href="/">לדף הבית</a> · <a href="/panel/">לפאנל</a></p>
<script>
(function () {
  var rows = document.getElementById("rows");
  function row(id, label) {
    var r = document.getElementById("r-" + id);
    if (!r) {
      r = document.createElement("div");
      r.id = "r-" + id;
      r.innerHTML = '<span class="mark">…</span><span class="lbl"></span><span class="val">בודק…</span>';
      r.querySelector(".lbl").textContent = label;
      rows.appendChild(r);
    }
    r.className = "row";
    return function (state, text) {
      r.className = "row " + (state === true ? "ok" : state === false ? "bad" : "");
      r.querySelector(".mark").textContent = state === true ? "✓" : state === false ? "✕" : "…";
      r.querySelector(".val").textContent = text;
    };
  }
  row("js", "JavaScript")(true, "פועל");

  var ua = navigator.userAgent;
  var ios = ua.match(/OS (\d+)[_.](\d+)(?:[_.](\d+))? like Mac OS X/);
  var saf = ua.match(/Version\/([\d.]+)/);
  var other = ua.match(/(CriOS|FxiOS|EdgiOS|Chrome|Firefox)\/([\d.]+)/);
  var desc = (ios ? "iOS " + ios[1] + "." + ios[2] + (ios[3] ? "." + ios[3] : "") + " · " : "") +
    (other ? other[1].replace("CriOS", "Chrome").replace("FxiOS", "Firefox").replace("EdgiOS", "Edge") + " " + other[2] : saf ? "Safari " + saf[1] : "");
  row("ua", "דפדפן")(true, "");
  var v = document.querySelector("#r-ua .val");
  var b = document.createElement("bdi"); b.textContent = desc || "לא זוהה";
  var c = document.createElement("code"); c.textContent = ua;
  v.appendChild(b); v.appendChild(document.createElement("br")); v.appendChild(c);

  var mod = "noModule" in document.createElement("script");
  row("mod", "מודולים")(mod, mod ? "נתמכים" : "לא נתמכים — הדפדפן ישן מדי");

  var st = row("ls", "אחסון מקומי");
  try { localStorage.setItem("am_check", "1"); localStorage.removeItem("am_check"); st(true, "פועל"); }
  catch (e) { st(false, "חסום (" + (e && e.name) + ") — אולי ״חסימת כל העוגיות״ מופעלת"); }

  function timed(url) {
    var t = Date.now();
    return fetch(url, { cache: "no-store" }).then(function (r) {
      return r.text().then(function (body) { return { r: r, body: body, ms: Date.now() - t }; });
    });
  }
  var sv = row("api", "שרת");
  timed("/v1/health").then(function (x) { sv(x.r.ok, "HTTP " + x.r.status + " · " + x.ms + " ms"); })
    .catch(function (e) { sv(false, "אין חיבור: " + (e && e.message)); });

  var pf = row("file", "קובץ הפאנל");
  timed("/panel/assets/panel.js").then(function (x) {
    pf(x.r.ok && x.body.length > 1000, "HTTP " + x.r.status + " · " + Math.round(x.body.length / 1024) + " KB · " + x.ms + " ms · " + (x.r.headers.get("content-type") || "?"));
  }).catch(function (e) { pf(false, "לא נטען: " + (e && e.message)); });

  var sw = row("sw", "Service worker");
  if (!("serviceWorker" in navigator)) sw(true, "לא נתמך (לא נדרש)");
  else navigator.serviceWorker.getRegistrations().then(function (l) { sw(true, l.length ? "רשום (" + l.length + ")" : "לא רשום"); })
    .catch(function (e) { sw(true, "לא זמין: " + (e && e.message)); });

  var run = row("run", "הרצת הפאנל");
  var f = document.getElementById("f");
  var t0 = Date.now();
  f.src = "/panel/?check=1";
  (function poll() {
    var w, d, app;
    try { w = f.contentWindow; d = f.contentDocument; app = d && d.getElementById("app"); } catch (e) { return run(false, "אין גישה למסגרת: " + e.message); }
    if (app && app.childElementCount) return run(true, "עלה תוך " + ((Date.now() - t0) / 1000).toFixed(1) + " שניות");
    if (w && w.__amBootError) return run(false, String(w.__amBootError).slice(0, 400));
    if (Date.now() - t0 > 30000) return run(false, "לא עלה תוך 30 שניות" + (d ? " (מצב: " + d.readyState + ")" : ""));
    setTimeout(poll, 400);
  })();
})();
</script>
</body>
</html>
