# Deploys the worker (API, site and panel) to Cloudflare on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until both exist the run only prints a notice and stops, so it never fails.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set yet; nothing deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install and build
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: npm ci && npm run build

      - name: Deploy to Cloudflare
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: npx wrangler deploy

      # No new migrations at the moment; a token without D1 rights should not block the deploy.
      - name: Apply database migrations
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        working-directory: worker
        run: npx wrangler d1 migrations apply addmedia --remote
