# Deploys the worker (API, site and panel) to Cloudflare on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until both exist the run only prints a notice and stops, so it never fails.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set yet; nothing deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install and build
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: npm ci && npm run build

      # On failure the end of wrangler's output becomes an annotation, readable without the full log.
      - name: Deploy to Cloudflare
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        env:
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            msg=$(tail -n 40 deploy.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=wrangler deploy failed::${msg}"
            exit 1
          fi

      # No new migrations at the moment; a token without D1 rights should not block the deploy.
      - name: Apply database migrations
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        working-directory: worker
        run: npx wrangler d1 migrations apply addmedia --remote
