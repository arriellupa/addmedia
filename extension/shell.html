<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>InThePage</title>
<style>
  :root { --bg: #F6F4FF; --ink: #17132B; --quiet: #4A4566; --primary: #5B2EF0; --on-primary: #fff; --seam: #5B2EF0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #13111D; --ink: #F2F0FA; --quiet: #BAB5CF; --primary: #8F73FF; --on-primary: #0E0A1F; --seam: #8F73FF; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", Arial, sans-serif; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 3px; background: var(--seam); z-index: 2; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .state { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
  .state[hidden], iframe[hidden] { display: none; }
  .mark { width: 40px; height: 40px; }
  .title { font-size: 17px; font-weight: 600; }
  .sub { color: var(--quiet); max-width: 320px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 9px 20px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <div class="state" id="loading" role="status" aria-live="polite">
    <img class="mark" src="icons/48.png" alt="">
    <div class="dot" aria-hidden="true"></div>
    <div class="sub">טוען את InThePage…</div>
  </div>
  <div class="state" id="offline" role="alert" hidden>
    <img class="mark" src="icons/48.png" alt="">
    <div class="title">אין חיבור ל-InThePage</div>
    <div class="sub" id="offline-sub">בדקו את החיבור לאינטרנט ונסו שוב.</div>
    <button id="retry" type="button">לנסות שוב</button>
  </div>
  <iframe id="app" title="InThePage" hidden allow="clipboard-read; clipboard-write"></iframe>
  <script src="shell.js"></script>
</body>
</html>
